name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la structure du projet
        run: |
          echo "Vérification des fichiers..."
          test -f README.md && echo "README présent."

      - name: Valider la syntaxe des scripts
        run: |
          echo "Analyse des scripts Shell..."
          find . -name "*.sh" -exec bash -n {} +
